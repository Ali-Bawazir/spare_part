{% extends "base.html" %}
{% block title %}PM schedule{% endblock %}
{% block page_heading %}PM schedule{% endblock %}
{% block content %}
<p class="mms-page-lead">Define preventive task frequency and next due date for a machine.</p>
<div class="mms-card mms-form-stack">
  <div class="mms-card-body">
    <form method="post" class="mms-form">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="mms-form-actions">
        <button class="mms-btn mms-btn--primary" type="submit">Save</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
