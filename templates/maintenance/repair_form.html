{% extends "base.html" %}
{% block title %}Repair request{% endblock %}
{% block page_heading %}Create repair request{% endblock %}
{% block content %}
<p class="mms-page-lead">Send equipment to an external vendor (UC-19). Procurement will progress the order.</p>
<div class="mms-card mms-form-stack">
  <div class="mms-card-body">
    <form method="post" class="mms-form">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="mms-form-actions">
        <button class="mms-btn mms-btn--primary" type="submit">Create</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
